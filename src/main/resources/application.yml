server:
  port: ${SERVER_PORT:3000}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: financial-news-api

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/cls_financial_news_database?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
      timeout: 3000ms

  # 邮件配置
  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your_email@example.com}
    password: ${MAIL_PASSWORD:your_smtp_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    default-encoding: UTF-8

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deletedAt
      logic-delete-value: "NOW()"
      logic-not-delete-value: "NULL"
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.stdout.StdOutImpl}

# Knife4j (Swagger) 配置
knife4j:
  enable: ${KNIFE4J_ENABLE:true}
  setting:
    language: zh_cn
    enable-swagger-models: true
    enable-document-manage: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: /api/**
      packages-to-scan: com.financial.news.controller

# JWT 配置（密钥必须通过环境变量注入）
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:604800000}  # 7天，单位毫秒
  issuer: ${JWT_ISSUER:cls-financial-news}
  audience: ${JWT_AUDIENCE:cls-financial-news-users}
  # JWT Cookie 配置
  cookie:
    name: jwt_token
    secure: ${JWT_COOKIE_SECURE:false}       # 生产环境必须为 true
    same-site: Lax

# AI 服务配置（OpenAI 兼容接口）
ai:
  api-key: ${AI_API_KEY:your_ai_api_key}
  api-base-url: ${AI_BASE_URL:https://api.openai.com/v1}
  model: ${AI_MODEL:gpt-3.5-turbo}
  max-tokens: ${AI_MAX_TOKENS:2000}
  temperature: ${AI_TEMPERATURE:0.7}

# 爬虫 Agent 配置（独立 LLM 实例，用于内容采集工作流）
crawler:
  agent:
    api-key: ${CRAWLER_AI_API_KEY:${AI_API_KEY:}}
    api-base-url: ${CRAWLER_AI_BASE_URL:${AI_BASE_URL:https://api.openai.com/v1}}
    model: ${CRAWLER_AI_MODEL:gpt-4o-mini}
    temperature: 0.3
    max-tokens: 4096
    # 单次爬取最大文章数
    max-articles-per-run: 20
    # HTTP 请求超时（秒）
    http-timeout: 30

# 文件上传配置
upload:
  storage-type: local
  max-size: 5242880
  avatar-max-size: 2097152
  allowed-types: image/jpeg,image/png,image/gif,image/webp
  dir: uploads
  url-prefix: /uploads

# 日志配置
logging:
  level:
    com.financial.news: ${LOG_LEVEL:debug}
    org.springframework.security: info
  file:
    path: ./logs
    name: ./logs/financial-news-api.log
