server:
  port: ${SERVER_PORT:3000}

spring:
  application:
    name: financial-news-api

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/cls_financial_news_database?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
      timeout: 3000ms

  # 邮件配置（本地默认 163，凭据为空时发送时才报错，不阻断启动）
  mail:
    host: ${MAIL_HOST:smtp.163.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    default-encoding: UTF-8

  # 文件上传配置（上限取视频 200MB；头像等小文件由业务层自行校验更小的上限）
  servlet:
    multipart:
      enabled: true
      max-file-size: 210MB
      max-request-size: 210MB

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# MyBatis 配置（原生 MyBatis，软删除过滤条件显式写在 mapper XML 中；createdAt/updatedAt 由 AuditTimeFillInterceptor 自动填充）
mybatis:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.stdout.StdOutImpl}

# 确定性采集流水线（无 LLM 编排）
crawler:
  ingest:
    max-articles-per-source: 20
    min-content-length: 200        # 正文纯文本最短字数（质量门禁）
    max-link-density: 0.6          # 正文链接密度上限（防导航/聚合页）
    max-mojibake-ratio: 0.05       # 乱码替换符占比上限（防编码错误页面当正文）
    rate-limit-interval-ms: 1500   # 同一 host 两次请求最小间隔
    near-dup-threshold: 6          # simhash 海明距离阈值，≤ 视为近似重复
    recent-fingerprint-scan: 500   # 近似去重比对的最近文章数
    cron-enabled-limit: 20         # 定时采集每源篇数上限
    cron: ${CRAWLER_INGEST_CRON:0 */30 * * * *}  # 定时采集，默认每30分钟；设 "-" 关闭
    ai-tagging:
      enabled: true                 # 入库前 AI 分类/打标；未配 AI_API_KEY 时自动降级为来源默认分类
      excerpt-length: 800           # 送入 LLM 的正文字数上限
    sources:
      wallstreetcn:
        enabled: true
        category: 全球市场
      sina:
        enabled: true
        category: 综合财经
      eastmoney:
        enabled: true
        category: A股
  # 爬虫 Agent 配置（旧 LLM 编排链路，默认关闭；本地默认个人端点）
  agent:
    # 未显式启用时不创建爬虫 Agent，避免缺少 key 阻断应用启动
    enabled: ${CRAWLER_AGENT_ENABLED:false}
    api-key: ${CRAWLER_AI_API_KEY:${AI_API_KEY:}}
    api-base-url: ${CRAWLER_AI_BASE_URL:https://api.xiaomimimo.com/v1}
    model: ${CRAWLER_AI_MODEL:mimo-v2.5}
    temperature: 0.3
    max-tokens: 4096
    # 单次爬取最大文章数
    max-articles-per-run: 20
    # HTTP 请求超时（秒）
    http-timeout: 120

# Knife4j (Swagger) 配置
knife4j:
  enable: ${KNIFE4J_ENABLE:true}
  setting:
    language: zh_cn
    enable-swagger-models: true
    enable-document-manage: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: /api/**
      packages-to-scan: com.financial.news.controller

# JWT 配置（基座带本地默认值，开箱即用；生产由 application-prod.yml 覆盖为强制环境变量）
jwt:
  secret: ${JWT_SECRET:dev-jwt-secret-key-local-only-0123456789abcdef!}
  expiration: ${JWT_EXPIRATION:604800000}
  issuer: ${JWT_ISSUER:cls-financial-news}
  audience: ${JWT_AUDIENCE:cls-financial-news-users}
  cookie:
    name: jwt_token
    secure: ${JWT_COOKIE_SECURE:false}       # 生产环境必须为 true
    same-site: Lax

# AI 服务配置（OpenAI 兼容接口，本地默认个人端点；生产由 application-prod.yml 覆盖）
ai:
  api-key: ${AI_API_KEY:}
  api-base-url: ${AI_BASE_URL:https://api.xiaomimimo.com/v1}
  model: ${AI_MODEL:mimo-v2.6-flash}
  max-tokens: ${AI_MAX_TOKENS:2000}
  temperature: ${AI_TEMPERATURE:0.7}
  # 联网搜索（MiMo Web Search 插件，需服务商控制台开通；仅 mimo-v2.5 / mimo-v2.5-pro 支持）
  web-search:
    model: ${AI_WEB_SEARCH_MODEL:mimo-v2.5-pro}   # webSearch=true 时使用的模型
    max-keyword: ${AI_WEB_SEARCH_MAX_KEYWORD:3}   # 每轮搜索并发关键词数，按次计费，控制成本
    force-search: ${AI_WEB_SEARCH_FORCE:false}    # false=意图识别(模型自行判断)；true=强制搜索

# 文件上传配置
upload:
  storage-type: local
  max-size: 5242880
  avatar-max-size: 2097152
  allowed-types: image/jpeg,image/png,image/gif,image/webp
  dir: uploads
  url-prefix: /uploads
  # 媒体文件（新闻配图/视频）上传到阿里云 OSS
  media:
    image-max-size: 10485760     # 10MB
    video-max-size: 209715200    # 200MB
  oss:
    endpoint: ${OSS_ENDPOINT:oss-cn-guangzhou.aliyuncs.com}                 # 如 https://oss-cn-hangzhou.aliyuncs.com
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket: ${OSS_BUCKET:financial-news}
    dir: media                                 # 对象 Key 前缀
    custom-domain: ${OSS_CUSTOM_DOMAIN:}       # 可选自定义/CDN 域名，如 https://cdn.example.com；为空则用 bucket 外网域名

# 日志配置
logging:
  level:
    com.financial.news: ${LOG_LEVEL:debug}
    org.springframework.security: info
  file:
    path: ./logs
    name: ./logs/financial-news-api.log
