name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:          # 手动发布所选分支，也必须先通过完整 CI

concurrency:
  group: ci-${{ github.ref }}
  # 开发分支取消旧检查；main 和手动发布不中断正在执行的部署
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      ai-test-mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      AI_GENERATION_TEST_JDBC_URL: jdbc:mysql://127.0.0.1:3306/?allowPublicKeyRetrieval=true&useSSL=false
      AI_GENERATION_TEST_DB_USER: root
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"
          cache: maven            # 自动缓存 ~/.m2/repository

      - name: Build & Verify
        run: mvn -B -ntp verify

      - name: Docker 镜像可构建校验
        run: docker build -t financial-news-api:ci .

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: SSH Deploy
        env:
          DEPLOY_SHA: ${{ github.sha }}   # 部署本次 CI 验证过的提交
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_SHA,DEPLOY_PATH
          script: |
            set -e
            cd "$DEPLOY_PATH"
            git fetch origin "$DEPLOY_SHA"
            git reset --hard "$DEPLOY_SHA"
            docker compose up -d --build

            # 等待应用就绪并做健康检查（最长约 2 分钟）
            ok=0
            for i in $(seq 1 60); do
              sleep 2
              if curl -fsS http://127.0.0.1:3000/health > /dev/null 2>&1; then
                ok=1
                break
              fi
            done
            if [ "$ok" != "1" ]; then
              echo "== 健康检查失败，app 最近日志： =="
              docker compose logs --tail 80 app || true
              exit 1
            fi
            echo "Deploy OK ($DEPLOY_SHA): $(curl -fsS http://127.0.0.1:3000/health)"
