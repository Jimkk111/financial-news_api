name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true   # 同分支新推送取消旧任务，省额度

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      ai-test-mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      AI_GENERATION_TEST_JDBC_URL: jdbc:mysql://127.0.0.1:3306/?allowPublicKeyRetrieval=true&useSSL=false
      AI_GENERATION_TEST_DB_USER: root
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"
          cache: maven            # 自动缓存 ~/.m2/repository

      - name: Build & Verify
        run: mvn -B -ntp verify

      - name: Docker 镜像可构建校验
        run: docker build -t financial-news-api:ci .
