name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:          # 手动触发（Actions 页面可选分支），用于重发布/按分支发布/回滚

concurrency:
  group: deploy-production
  cancel-in-progress: false   # 部署任务排队执行，不互相打断

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production   # 可在 Settings → Environments 给 production 配置审批人，合入后需人工批准才真正发布
    steps:
      # 部署前先在 CI 侧编译验证，坏代码直接红在这，不到服务器上才失败
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"
          cache: maven

      - name: Pre-deploy verify
        run: mvn -B -ntp verify

      - name: SSH Deploy
        env:
          DEPLOY_REF: ${{ github.ref_name }}   # push 到 main 时为 main；手动触发时为所选分支
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_REF
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin
            git reset --hard "origin/$DEPLOY_REF"
            docker compose up -d --build

            # 等待应用就绪并做健康检查（最长约 2 分钟）
            ok=0
            for i in $(seq 1 60); do
              sleep 2
              if curl -fsS http://127.0.0.1:3000/health > /dev/null 2>&1; then
                ok=1
                break
              fi
            done
            if [ "$ok" != "1" ]; then
              echo "== 健康检查失败，app 最近日志： =="
              docker compose logs --tail 80 app || true
              exit 1
            fi
            echo "Deploy OK: $(curl -fsS http://127.0.0.1:3000/health)"
