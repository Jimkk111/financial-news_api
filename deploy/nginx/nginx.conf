worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ==================== 日志格式 ====================
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # ==================== 性能优化 ====================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ==================== Gzip 压缩 ====================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ==================== 安全头 ====================
    server_tokens off;

    # ==================== 限流配置 ====================
    # API 限流：每秒 30 个请求，突发 50
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # ==================== 后端上游 ====================
    # Docker 内置 DNS 动态解析，避免 app 未就绪时 Nginx 启动失败
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ==================== HTTP 服务 ====================
    server {
        listen 80;
        server_name _;

        # --- 请求大小限制（匹配文件上传 5MB） ---
        client_max_body_size 10m;

        # --- API 反向代理 ---
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            set $backend http://app:3000;
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE 流式响应支持（AI 对话、爬虫）
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # 超时
            proxy_connect_timeout 10s;
            proxy_timeout 60s;
        }

        # --- 健康检查 ---
        location /health {
            set $backend http://app:3000;
            proxy_pass $backend;
            proxy_set_header Host $host;
            access_log off;
        }

        # --- 上传文件静态服务 ---
        location /uploads/ {
            alias /app/uploads/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;

            # 允许跨域（前端可能需要）
            add_header Access-Control-Allow-Origin *;
        }

        # --- Swagger/API 文档（生产环境建议注释掉） ---
        location /swagger-ui.html {
            set $backend http://app:3000;
            proxy_pass $backend;
            proxy_set_header Host $host;
        }

        location /v3/api-docs {
            set $backend http://app:3000;
            proxy_pass $backend;
            proxy_set_header Host $host;
        }

        location /doc.html {
            set $backend http://app:3000;
            proxy_pass $backend;
            proxy_set_header Host $host;
        }

        # --- 前端静态资源（如果需要在此 Nginx 同时托管前端） ---
        # 取消下方注释并调整前端文件路径：
        # location / {
        #     root /usr/share/nginx/html;
        #     index index.html;
        #     try_files $uri $uri/ /index.html;  # SPA 路由支持
        # }

        # --- 默认 404 ---
        location / {
            return 404 '{"code":"404","msg":"Not Found"}';
            add_header Content-Type application/json;
        }
    }

    # ==================== HTTPS 配置（取消注释以启用） ====================
    # 前提条件：
    #   1. 在宿主机使用 certbot 签发 SSL 证书：
    #      certbot certonly --webroot -w /var/www/certbot -d your-domain.com
    #   2. 证书文件放到 deploy/certs/ 目录：
    #      deploy/certs/fullchain.pem
    #      deploy/certs/privkey.pem
    #   3. 取消 docker-compose.yml 中 443 端口的注释
    #   4. 取消下方注释
    #
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     client_max_body_size 10m;
    #
    #     # HSTS
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     location /api/ {
    #         limit_req zone=api_limit burst=50 nodelay;
    #         proxy_pass http://backend;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #         proxy_buffering off;
    #         proxy_cache off;
    #         proxy_read_timeout 300s;
    #         proxy_send_timeout 300s;
    #     }
    #
    #     location /health {
    #         proxy_pass http://backend;
    #         access_log off;
    #     }
    #
    #     location /uploads/ {
    #         alias /app/uploads/;
    #         expires 30d;
    #         add_header Cache-Control "public, immutable";
    #         access_log off;
    #     }
    #
    #     location / {
    #         root /usr/share/nginx/html;
    #         index index.html;
    #         try_files $uri $uri/ /index.html;
    #     }
    # }
    #
    # --- HTTP 跳转 HTTPS（取消注释以启用） ---
    # server {
    #     listen 80;
    #     server_name your-domain.com;
    #     return 301 https://$host$request_uri;
    # }
}
